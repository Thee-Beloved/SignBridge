<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1815"/>
      <stop offset="45%" stop-color="#2d1d16"/>
      <stop offset="75%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </linearGradient>
    <radialGradient id="steamG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pilauRice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background Kitchen Ambience -->
  <rect width="360" height="640" fill="url(#reelGrad)"/>
  
  <!-- Warm kitchen background shelves -->
  <rect x="0" y="80" width="360" height="12" fill="#382319" opacity="0.6"/>
  <rect x="30" y="45" width="24" height="35" rx="3" fill="#64748b" opacity="0.5"/>
  <rect x="65" y="50" width="20" height="30" rx="3" fill="#b45309" opacity="0.6"/>
  <rect x="95" y="40" width="28" height="40" rx="3" fill="#047857" opacity="0.4"/>
  <rect x="250" y="52" width="22" height="28" rx="2" fill="#a16207" opacity="0.5"/>

  <!-- Warm Kitchen Spotlight -->
  <circle cx="180" cy="320" r="180" fill="#f59e0b" opacity="0.08"/>

  <!-- Wooden Countertop Surface -->
  <path d="M 0 380 L 360 380 L 360 640 L 0 640 Z" fill="#291811"/>
  <line x1="0" y1="420" x2="360" y2="420" stroke="#3d2419" stroke-width="2"/>
  <line x1="0" y1="480" x2="360" y2="480" stroke="#3d2419" stroke-width="2"/>

  <!-- Sufuria (Kenyan Heavy Aluminum Cooking Pot) -->
  <ellipse cx="180" cy="350" rx="100" ry="24" fill="#64748b"/>
  <path d="M 80 350 C 80 430 280 430 280 350 Z" fill="url(#potGrad)"/>
  <ellipse cx="180" cy="350" rx="94" ry="20" fill="url(#pilauRice)"/>

  <!-- Pilau Details: Spices, Beef Chunks, Cardamom, Cumin -->
  <circle cx="150" cy="346" r="6" fill="#451a03"/>
  <circle cx="210" cy="352" r="7" fill="#451a03"/>
  <circle cx="175" cy="358" r="8" fill="#581c87"/>
  <ellipse cx="130" cy="352" rx="3" ry="5" fill="#fef08a" transform="rotate(30, 130, 352)"/>
  <ellipse cx="225" cy="346" rx="3" ry="5" fill="#fef08a" transform="rotate(-20, 225, 346)"/>
  <!-- Cilantro / Dania Sprigs -->
  <path d="M 170 348 Q 185 342 190 352" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="185" cy="343" r="2" fill="#22c55e"/>

  <!-- Rising Aromatic Steam -->
  <ellipse cx="180" cy="270" rx="45" ry="70" fill="url(#steamG)"/>
  <ellipse cx="150" cy="230" rx="30" ry="50" fill="url(#steamG)"/>
  <ellipse cx="210" cy="240" rx="35" ry="55" fill="url(#steamG)"/>

  <!-- Ingredients on Counter: Fresh Tomatoes, Garlic, Red Onion -->
  <circle cx="50" cy="450" r="16" fill="#dc2626"/>
  <path d="M 50 434 Q 52 430 50 428" stroke="#16a34a" stroke-width="2" fill="none"/>
  
  <circle cx="76" cy="460" r="14" fill="#ef4444"/>
  <circle cx="68" cy="442" r="12" fill="#b91c1c"/>

  <!-- Red Onion -->
  <ellipse cx="310" cy="460" rx="16" ry="14" fill="#701a75"/>
  <circle cx="310" cy="450" r="3" fill="#a21caf"/>

  <!-- Chef Wooden Spoon / Mwiko Stirring -->
  <path d="M 230 240 L 250 220 L 190 340 L 178 335 Z" fill="#b45309"/>

  <!-- Cinematic Reel Lighting Vignette -->
  <rect width="360" height="640" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="20"/>
</svg>
